name: Static safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-safety:
    name: Static safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate static safety
        run: |
          git diff --check
          node --check v2-core.js
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');

          const required = new Set([
            '.gitattributes', '.gitignore', '.nojekyll', 'CNAME', 'README.md',
            'index.html', 'v2-core.js', 'v2-theme.css',
            '.github/workflows/validate.yml'
          ]);
          const allowedUrls = new Set([
            'https://engaz.premiumpower-eg.com/',
            'https://clinic.engaz.premiumpower-eg.com/',
            'https://lab.engaz.premiumpower-eg.com/',
            'https://automation.engaz.premiumpower-eg.com/'
          ]);
          const failures = [];
          const fail = (message) => failures.push(message);

          function walk(directory) {
            const found = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === '.git') continue;
              const absolute = path.join(directory, entry.name);
              if (entry.isDirectory()) found.push(...walk(absolute));
              else found.push(path.relative('.', absolute).replaceAll(path.sep, '/'));
            }
            return found;
          }

          const files = walk('.');
          for (const file of files) if (!required.has(file)) fail(`forbidden path: ${file}`);
          for (const file of required) if (!files.includes(file)) fail(`missing required file: ${file}`);
          if (fs.readFileSync('CNAME', 'utf8').trim() !== 'lab.engaz.premiumpower-eg.com') fail('unexpected CNAME');

          const decoder = new TextDecoder('utf-8', { fatal: true });
          for (const file of files) {
            const bytes = fs.readFileSync(file);
            try { decoder.decode(bytes); } catch { fail(`invalid UTF-8: ${file}`); }
            if (bytes.includes(13)) fail(`CR line ending: ${file}`);
          }

          const html = fs.readFileSync('index.html', 'utf8');
          const core = fs.readFileSync('v2-core.js', 'utf8');
          const css = fs.readFileSync('v2-theme.css', 'utf8');
          const runtime = `${html}\n${core}\n${css}`;

          const forbidden = [
            [/fonts\.googleapis|fonts\.gstatic|@import\s+url/i, 'remote font'],
            [/(?:^|[^\d])01[0125]\d{8}(?!\d)/, 'Egyptian mobile number'],
            [/\b(?:fetch|XMLHttpRequest|WebSocket|EventSource|sendBeacon|localStorage|sessionStorage|indexedDB)\b|document\.cookie|\.innerHTML\b|\beval\s*\(/i, 'network, persistence, or unsafe DOM API'],
            [/-----BEGIN [^-]+ PRIVATE KEY-----|\bAKIA[0-9A-Z]{16}\b|\bgh[pousr]_[A-Za-z0-9]{20,}\b/i, 'credential-like value'],
            [/(?:api[_-]?key|client[_-]?secret|password|passwd|access[_-]?token)\s*[:=]\s*["']?[A-Za-z0-9/+_.-]{8,}/i, 'credential assignment'],
            [/L-01\d{2}/, 'legacy order code']
          ];
          for (const [pattern, label] of forbidden) if (pattern.test(runtime)) fail(`found ${label}`);

          const oldNames = [
            'معمل النيل للتحاليل', 'سارة محمود', 'كريم أحمد', 'منى سمير',
            'محمد علي', 'هبة حسن', 'يوسف طارق', 'آية إبراهيم', 'عمر وليد'
          ];
          for (const name of oldNames) if (runtime.includes(name)) fail(`residual original name: ${name}`);
          for (let index = 1; index <= 8; index += 1) {
            const digits = String(index).padStart(2, '0').replace(/\d/g, (digit) => '٠١٢٣٤٥٦٧٨٩'[Number(digit)]);
            if (!html.includes(`مريض تجريبي ${digits}`)) fail(`missing synthetic patient ${digits}`);
            if (!html.includes(`DEMO-${String(index).padStart(4, '0')}`)) fail(`missing synthetic code ${index}`);
          }

          const urls = [...runtime.matchAll(/https?:\/\/[^\s"'<>`]+/g)]
            .map((match) => match[0].replace(/[),.;]+$/, ''));
          for (const url of urls) if (!allowedUrls.has(url)) fail(`URL outside allowlist: ${url}`);
          if (urls.length !== 4) fail(`expected four navigation URLs, found ${urls.length}`);

          for (const ref of [...html.matchAll(/\b(?:href|src)\s*=\s*["']([^"']+)["']/gi)].map((match) => match[1])) {
            if (/^https?:\/\//i.test(ref)) {
              if (!allowedUrls.has(ref)) fail(`HTML URL outside allowlist: ${ref}`);
            } else if (ref.startsWith('#')) {
              continue;
            } else if (!fs.existsSync(ref.replace(/^\.\//, ''))) {
              fail(`broken local reference: ${ref}`);
            }
          }

          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map((match) => match[1]);
          if (new Set(ids).size !== ids.length) fail('duplicate HTML id');
          const idSet = new Set(ids);
          for (const match of html.matchAll(/\b(?:aria-labelledby|aria-describedby|aria-controls|aria-owns|for)=["']([^"']+)["']/gi)) {
            for (const id of match[1].split(/\s+/)) if (id && !idSet.has(id)) fail(`missing id reference: ${id}`);
          }

          const blocks = [...html.matchAll(/<script\b(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi)].map((match) => match[1]);
          if (blocks.length !== 1) fail(`expected one inline script, found ${blocks.length}`);
          else try { new vm.Script(blocks[0], { filename: 'index-inline.js' }); } catch (error) { fail(error.message); }

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`Static safety passed: ${files.length} files checked.`);
          NODE
